<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Benchy-Galerie der vorrätigen 3D-Druck-Filamente">
<title>Benchy Filament-Galerie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root {
    --bg: #F2F4F6;
    --surface: #FFFFFF;
    --surface-2: #E8EBEF;
    --line: #D5DAE1;
    --line-strong: #B9C1CB;
    --text: #14181D;
    --text-dim: #5A6470;
    --accent: #245BC4;
    --accent-soft: #DEE7FA;
    --ok-fg: #16653C;
    --ok-bg: #D8EFE1;
    --off-fg: #6B7480;
    --off-bg: #E2E6EA;
    --shadow: 0 1px 2px rgba(20, 24, 29, .06), 0 8px 20px -14px rgba(20, 24, 29, .35);
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1216;
      --surface: #171B21;
      --surface-2: #1F252D;
      --line: #2A313A;
      --line-strong: #3A434F;
      --text: #E6EAEF;
      --text-dim: #97A1AD;
      --accent: #6EA1FF;
      --accent-soft: #1C2A44;
      --ok-fg: #7FDCA9;
      --ok-bg: #163024;
      --off-fg: #8C97A3;
      --off-bg: #232A32;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 24px -16px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1216;
    --surface: #171B21;
    --surface-2: #1F252D;
    --line: #2A313A;
    --line-strong: #3A434F;
    --text: #E6EAEF;
    --text-dim: #97A1AD;
    --accent: #6EA1FF;
    --accent-soft: #1C2A44;
    --ok-fg: #7FDCA9;
    --ok-bg: #163024;
    --off-fg: #8C97A3;
    --off-bg: #232A32;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 24px -16px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, .label { font-family: Archivo, system-ui, "Segoe UI", sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Kopf ---------- */
  header.top {
    border-bottom: 1px solid var(--line);
    background: var(--surface);
  }
  .top-inner {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 18px;
    padding: 22px 0 18px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.01em; margin: 0; }
  .tagline { color: var(--text-dim); font-size: .95rem; margin: 0; }
  .stat-strip {
    margin-left: auto; display: flex; gap: 20px;
  }
  .stat { display: flex; flex-direction: column; }
  .stat b { font-family: "IBM Plex Mono", monospace; font-size: 1.25rem; font-weight: 500; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }

  /* ---------- Werkzeugleiste ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .toolbar-inner { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 0; }
  .search {
    flex: 1 1 220px; min-width: 180px;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
    padding: 7px 11px;
  }
  .search svg { flex: none; color: var(--text-dim); }
  .search input {
    border: 0; background: transparent; color: inherit; font: inherit; width: 100%; outline: none;
  }
  select {
    font: inherit; color: inherit; background: var(--bg);
    border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px;
  }
  .switch {
    display: inline-flex; align-items: center; gap: 9px; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 13px 6px 9px; user-select: none; font-size: .95rem;
  }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    width: 34px; height: 19px; border-radius: 999px; background: var(--line-strong);
    position: relative; transition: background .16s ease; flex: none;
  }
  .track::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; transition: transform .16s ease;
    box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
  }
  .switch input:checked + .track { background: var(--accent); }
  .switch input:checked + .track::after { transform: translateX(15px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 12px; }
  .chip {
    font: inherit; font-size: .85rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text-dim);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--text);
    font-weight: 600;
  }
  .chip .n { font-family: "IBM Plex Mono", monospace; font-size: .78em; opacity: .7; margin-left: 5px; }

  /* ---------- Raster ---------- */
  main { padding: 22px 0 60px; }
  .countline { color: var(--text-dim); font-size: .9rem; margin: 0 0 14px; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(216px, 1fr));
  }
  .card {
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow);
    transition: transform .13s ease, border-color .13s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .card.out { box-shadow: none; border-style: dashed; }
  .card.out .shot { opacity: .55; filter: saturate(.5); }

  .shot {
    display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0;
    background: var(--surface-2); cursor: zoom-in; position: relative; overflow: hidden;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot svg { width: 100%; height: 100%; display: block; }
  .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

  .meta { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 7px; }
  .name-row { display: flex; align-items: center; gap: 8px; }
  .swatch {
    width: 15px; height: 15px; border-radius: 4px; flex: none;
    border: 1px solid rgba(128, 137, 148, .55);
  }
  .card h3 { margin: 0; font-size: .98rem; font-weight: 600; line-height: 1.25; }
  .sub { margin: 0; color: var(--text-dim); font-size: .85rem; }
  .pill {
    align-self: flex-start; font-size: .74rem; letter-spacing: .03em; text-transform: uppercase;
    font-family: Archivo, sans-serif; font-weight: 600;
    padding: 3px 9px; border-radius: 999px;
  }
  .pill.in { background: var(--ok-bg); color: var(--ok-fg); }
  .pill.out { background: var(--off-bg); color: var(--off-fg); }

  .empty {
    border: 1px dashed var(--line-strong); border-radius: var(--r);
    padding: 40px 20px; text-align: center; color: var(--text-dim);
  }

  /* ---------- Detail ---------- */
  dialog {
    padding: 0; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); color: var(--text);
    max-width: 760px; width: calc(100vw - 32px); box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .7);
  }
  dialog::backdrop { background: rgba(9, 12, 16, .62); }
  .d-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  @media (max-width: 620px) { .d-grid { grid-template-columns: 1fr; } }
  .d-shot { background: var(--surface-2); aspect-ratio: 4 / 3; }
  .d-shot img, .d-shot svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-body { padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
  .d-body h2 { margin: 0; font-size: 1.3rem; line-height: 1.2; }
  dl.specs { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .92rem; }
  dl.specs dt { color: var(--text-dim); }
  dl.specs dd { margin: 0; }
  .note { font-size: .92rem; color: var(--text-dim); border-left: 2px solid var(--line-strong); padding-left: 11px; }
  .d-close {
    position: absolute; top: 10px; right: 12px; z-index: 2;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer;
  }

  /* ---------- Fuß ---------- */
  footer.foot {
    border-top: 1px solid var(--line); background: var(--surface);
    padding: 18px 0 30px; color: var(--text-dim); font-size: .88rem;
  }
  .foot-inner { display: flex; flex-wrap: wrap; gap: 12px 22px; align-items: center; }
  .btn {
    font: inherit; font-size: .9rem; cursor: pointer;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    border-radius: var(--r); padding: 6px 13px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .banner {
    background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    border-radius: var(--r); padding: 10px 14px; font-size: .9rem; margin: 0 0 18px;
  }
  .banner b { font-family: Archivo, sans-serif; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>Benchy Filament-Galerie</h1>
      <p class="tagline">Jede Farbe als gedrucktes Boot — was im Regal steht, ist sichtbar.</p>
    </div>
    <div class="stat-strip">
      <div class="stat"><b id="statIn">–</b><span>lagernd</span></div>
      <div class="stat"><b id="statAll">–</b><span>gesamt</span></div>
    </div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap">
    <div class="toolbar-inner">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path>
        </svg>
        <input id="q" type="search" placeholder="Farbe, Hersteller, Notiz …" autocomplete="off">
      </label>
      <select id="vendor" aria-label="Hersteller filtern"><option value="">Alle Hersteller</option></select>
      <select id="sort" aria-label="Sortierung">
        <option value="farbton">Nach Farbton</option>
        <option value="name">Nach Name</option>
        <option value="hersteller">Nach Hersteller</option>
      </select>
      <label class="switch">
        <input id="onlyStock" type="checkbox" checked>
        <span class="track"></span>
        <span>Nur lagernd</span>
      </label>
    </div>
    <div class="chips" id="materials"></div>
  </div>
</div>

<main class="wrap">
  <div id="banner"></div>
  <p class="countline" id="countline"></p>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <span>Bestand kommt aus <code class="mono">filaments.csv</code> — Datei ändern, fertig.</span>
    <button class="btn" id="pickCsv" type="button">CSV vom Rechner laden</button>
    <input id="csvFile" type="file" accept=".csv,text/csv" hidden>
  </div>
</footer>

<dialog id="detail">
  <button class="d-close" id="dClose" type="button" aria-label="Schließen">×</button>
  <div class="d-grid">
    <div class="d-shot" id="dShot"></div>
    <div class="d-body" id="dBody"></div>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  /* ---------- Beispieldaten: greifen nur, wenn keine filaments.csv gefunden wird ---------- */
  var DEMO = [
    ["bambu-pla-basic-schwarz","Bambu Lab","PLA Basic","Schwarz","#1B1D21","ja","","220","60","2","AMS Slot 1"],
    ["bambu-pla-basic-gruen","Bambu Lab","PLA Basic","Bambu Grün","#00AE42","ja","","220","60","1",""],
    ["bambu-pla-silk-gold","Bambu Lab","PLA Silk","Gold","#C9A227","ja","","230","60","1","schöner Glanz, für Deko-Teile"],
    ["bambu-petg-hf-orange","Bambu Lab","PETG HF","Orange","#E8590C","nein","","255","70","0","nachbestellen"],
    ["polymaker-polyterra-muted-blue","Polymaker","PLA","Muted Blue","#4A6FA5","ja","","215","60","1",""],
    ["prusament-pla-galaxy-black","Prusament","PLA","Galaxy Black","#2A2C35","nein","","215","60","0",""],
    ["extrudr-petg-anthrazit","Extrudr","PETG","Anthrazit","#3B3F42","ja","","240","80","2","Standard für Außenteile"],
    ["fiberlogy-petg-burgund","Fiberlogy","PETG","Burgund","#6E1F2B","nein","","240","80","0",""],
    ["esun-abs-weiss","eSun","ABS+","Weiß","#F1F1ED","ja","","250","100","1","nur im Gehäuse drucken"],
    ["sunlu-plaplus-grau","Sunlu","PLA+","Grau","#8A8D91","ja","","210","60","3","Arbeitspferd"],
    ["filamentum-asa-traffic-red","Fillamentum","ASA","Traffic Red","#B4232A","nein","","255","105","0",""],
    ["overture-tpu-natur","Overture","TPU 95A","Natur transparent","#DCD9CF","ja","","230","50","1","langsam drucken, 20 mm/s"],
    ["azurefilm-pla-sky-blue","AzureFilm","PLA","Sky Blue","#3FA9D8","ja","","210","60","1",""],
    ["devildesign-pla-neongruen","Devil Design","PLA","Neon Grün","#7BE12A","nein","","215","60","0","leuchtet gut unter UV"]
  ].map(function (r) {
    return { id: r[0], hersteller: r[1], material: r[2], farbe: r[3], hex: r[4], lagernd: r[5],
             foto: r[6], duese_c: r[7], bett_c: r[8], spulen: r[9], notizen: r[10] };
  });

  /* ---------- CSV ---------- */
  function detectDelimiter(text) {
    var head = text.split(/\r?\n/)[0] || "";
    var counts = { ",": 0, ";": 0, "\t": 0 }, inQ = false;
    for (var i = 0; i < head.length; i++) {
      var c = head[i];
      if (c === '"') inQ = !inQ;
      else if (!inQ && counts.hasOwnProperty(c)) counts[c]++;
    }
    return counts[";"] > counts[","] ? ";" : (counts["\t"] > counts[","] ? "\t" : ",");
  }

  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    var d = detectDelimiter(text);
    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === d) { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignorieren */ }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (v) { return v.trim() !== ""; }); });
    if (!rows.length) return [];
    var head = rows.shift().map(function (h) {
      return h.trim().toLowerCase()
        .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
        .replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    });
    return rows.map(function (r) {
      var o = {};
      head.forEach(function (h, i) { o[h] = (r[i] || "").trim(); });
      return o;
    });
  }

  var TRUE_WORDS = ["ja", "j", "yes", "y", "true", "wahr", "1", "x", "lagernd", "vorhanden"];
  function inStock(row) {
    var v = String(row.lagernd == null ? "" : row.lagernd).trim().toLowerCase();
    if (v === "") {
      var s = parseFloat(String(row.spulen || "").replace(",", "."));
      return isFinite(s) ? s > 0 : false;
    }
    return TRUE_WORDS.indexOf(v) !== -1;
  }

  function normalize(rows) {
    return rows.map(function (r, i) {
      var hex = (r.hex || r.hexcode || r.farbcode || "").trim();
      if (hex && hex[0] !== "#") hex = "#" + hex;
      if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex)) hex = "#9AA3AD";
      return {
        id: r.id || ("row-" + i),
        hersteller: r.hersteller || r.marke || r.vendor || "",
        material: r.material || r.typ || "",
        farbe: r.farbe || r.name || r.color || ("Filament " + (i + 1)),
        hex: hex,
        stock: inStock(r),
        foto: r.foto || r.bild || r.image || "",
        duese: r.duese_c || r.duese || r.nozzle || "",
        bett: r.bett_c || r.bett || r.bed || "",
        spulen: r.spulen || r.anzahl || "",
        notizen: r.notizen || r.notiz || r.bemerkung || ""
      };
    });
  }

  /* ---------- Ersatzbild, solange kein Foto da ist ---------- */
  function boatSVG(hex) {
    var dark = luminance(hex) < 0.45;
    var deck = dark ? "rgba(255,255,255,.30)" : "rgba(0,0,0,.22)";
    var line = dark ? "rgba(255,255,255,.55)" : "rgba(0,0,0,.40)";
    return '<svg viewBox="0 0 160 120" role="img" aria-label="Platzhalter, noch kein Foto">' +
      '<rect width="160" height="120" fill="' + hex + '"/>' +
      '<g fill="' + deck + '" stroke="' + line + '" stroke-width="2" stroke-linejoin="round">' +
      '<path d="M34 78h92l-13 20H47z"/>' +
      '<path d="M56 50h44v28H56z"/>' +
      '<rect x="103" y="34" width="11" height="20" rx="3"/>' +
      '</g>' +
      '<g fill="none" stroke="' + line + '" stroke-width="2" stroke-linecap="round">' +
      '<circle cx="70" cy="63" r="6"/><path d="M20 104h30M60 104h34M104 104h36"/>' +
      '</g></svg>';
  }

  function luminance(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function hue(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d < 0.06) return 400 + luminance(hex) * 100; // Graustufen ans Ende, hell nach dunkel
    var hh = 0;
    if (max === r) hh = ((g - b) / d + 6) % 6;
    else if (max === g) hh = (b - r) / d + 2;
    else hh = (r - g) / d + 4;
    return hh * 60;
  }

  /* ---------- Zustand ---------- */
  var DATA = [], state = { q: "", vendor: "", material: "", onlyStock: true, sort: "farbton" };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), dlg = $("detail");

  function shotHTML(f, big) {
    if (f.foto) {
      var src = /^https?:/.test(f.foto) ? f.foto : "images/" + f.foto;
      return '<img src="' + esc(src) + '" alt="Benchy in ' + esc(f.farbe) + '" loading="' + (big ? "eager" : "lazy") + '" ' +
        'onerror="this.parentNode.innerHTML=this.getAttribute(\'data-fb\')" data-fb="' + esc(boatSVG(f.hex)) + '">';
    }
    return boatSVG(f.hex);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function visible() {
    var q = state.q.toLowerCase();
    return DATA.filter(function (f) {
      if (state.onlyStock && !f.stock) return false;
      if (state.vendor && f.hersteller !== state.vendor) return false;
      if (state.material && f.material !== state.material) return false;
      if (q) {
        var hay = (f.farbe + " " + f.hersteller + " " + f.material + " " + f.notizen).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    }).sort(function (a, b) {
      if (state.sort === "name") return a.farbe.localeCompare(b.farbe, "de");
      if (state.sort === "hersteller") return (a.hersteller + a.farbe).localeCompare(b.hersteller + b.farbe, "de");
      return hue(a.hex) - hue(b.hex);
    });
  }

  function render() {
    var list = visible();
    $("countline").textContent = list.length + " von " + DATA.length + " Filamenten sichtbar" +
      (state.onlyStock ? " · nicht lagernde ausgeblendet" : "");
    if (!list.length) {
      grid.innerHTML = '<p class="empty">Nichts gefunden. Filter zurücksetzen oder „Nur lagernd“ ausschalten.</p>';
      return;
    }
    grid.innerHTML = list.map(function (f, i) {
      return '<article class="card' + (f.stock ? "" : " out") + '">' +
        '<button class="shot" type="button" data-i="' + i + '">' + shotHTML(f, false) + '</button>' +
        '<div class="meta">' +
        '<div class="name-row"><span class="swatch" style="background:' + esc(f.hex) + '"></span><h3>' + esc(f.farbe) + '</h3></div>' +
        '<p class="sub">' + esc(f.hersteller) + (f.hersteller && f.material ? " · " : "") + esc(f.material) + '</p>' +
        (f.stock
          ? '<span class="pill in">lagernd' + (f.spulen ? " · " + esc(f.spulen) + " Spule" + (f.spulen === "1" ? "" : "n") : "") + '</span>'
          : '<span class="pill out">nicht lagernd</span>') +
        '</div></article>';
    }).join("");
    Array.prototype.forEach.call(grid.querySelectorAll(".shot"), function (b) {
      b.addEventListener("click", function () { openDetail(list[+b.dataset.i]); });
    });
  }

  function openDetail(f) {
    $("dShot").innerHTML = shotHTML(f, true);
    var rows = [
      ["Hersteller", f.hersteller], ["Material", f.material], ["Farbcode", f.hex.toUpperCase()],
      ["Düse", f.duese ? f.duese + " °C" : ""], ["Bett", f.bett ? f.bett + " °C" : ""],
      ["Spulen im Regal", f.stock ? (f.spulen || "1") : "0"]
    ].filter(function (r) { return r[1]; });
    $("dBody").innerHTML =
      '<div class="name-row"><span class="swatch" style="background:' + esc(f.hex) + '"></span>' +
      '<span class="pill ' + (f.stock ? "in" : "out") + '">' + (f.stock ? "lagernd" : "nicht lagernd") + '</span></div>' +
      '<h2>' + esc(f.farbe) + '</h2>' +
      '<dl class="specs">' + rows.map(function (r) {
        return '<dt>' + esc(r[0]) + '</dt><dd class="mono">' + esc(r[1]) + '</dd>';
      }).join("") + '</dl>' +
      (f.notizen ? '<p class="note">' + esc(f.notizen) + '</p>' : "");
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }

  function buildFilters() {
    var vend = {}, mat = {};
    DATA.forEach(function (f) {
      if (f.hersteller) vend[f.hersteller] = (vend[f.hersteller] || 0) + 1;
      if (f.material) mat[f.material] = (mat[f.material] || 0) + 1;
    });
    var sel = $("vendor");
    sel.innerHTML = '<option value="">Alle Hersteller</option>' +
      Object.keys(vend).sort(function (a, b) { return a.localeCompare(b, "de"); }).map(function (v) {
        return '<option value="' + esc(v) + '">' + esc(v) + " (" + vend[v] + ")</option>";
      }).join("");
    $("materials").innerHTML = '<button class="chip" type="button" data-m="" aria-pressed="true">Alle Materialien</button>' +
      Object.keys(mat).sort(function (a, b) { return mat[b] - mat[a] || a.localeCompare(b, "de"); }).map(function (m) {
        return '<button class="chip" type="button" data-m="' + esc(m) + '" aria-pressed="false">' + esc(m) +
          '<span class="n">' + mat[m] + "</span></button>";
      }).join("");
    Array.prototype.forEach.call($("materials").children, function (c) {
      c.addEventListener("click", function () {
        state.material = c.dataset.m;
        Array.prototype.forEach.call($("materials").children, function (o) {
          o.setAttribute("aria-pressed", String(o === c));
        });
        render();
      });
    });
    $("statAll").textContent = DATA.length;
    $("statIn").textContent = DATA.filter(function (f) { return f.stock; }).length;
  }

  function load(rows, note) {
    DATA = normalize(rows);
    $("banner").innerHTML = note ? '<p class="banner">' + note + "</p>" : "";
    buildFilters();
    render();
  }

  /* ---------- Ereignisse ---------- */
  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("vendor").addEventListener("change", function (e) { state.vendor = e.target.value; render(); });
  $("sort").addEventListener("change", function (e) { state.sort = e.target.value; render(); });
  $("onlyStock").addEventListener("change", function (e) { state.onlyStock = e.target.checked; render(); });
  $("dClose").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  $("pickCsv").addEventListener("click", function () { $("csvFile").click(); });
  $("csvFile").addEventListener("change", function (e) {
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { load(parseCSV(String(fr.result)), "<b>" + esc(file.name) + "</b> geladen — " +
      "gilt nur für diese Sitzung. Dauerhaft: Datei im Repo ersetzen."); };
    fr.readAsText(file, "utf-8");
  });

  /* ---------- Start ---------- */
  fetch("filaments.csv", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (t) {
      var rows = parseCSV(t);
      if (!rows.length) throw new Error("leer");
      load(rows, "");
    })
    .catch(function () {
      load(DEMO, "<b>Beispieldaten.</b> Sobald neben der Seite eine <code class=\"mono\">filaments.csv</code> liegt, " +
        "zeigt die Galerie deinen echten Bestand. Zum Ausprobieren: „CSV vom Rechner laden“ unten.");
    });
})();
</script>

</body>
</html>
