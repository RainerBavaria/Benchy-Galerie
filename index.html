<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Benchy-Galerie der vorrätigen 3D-Druck-Filamente">
<title>Benchy Filament-Galerie</title>
<style>
  :root {
    --bg: #F2F4F6;
    --surface: #FFFFFF;
    --surface-2: #E8EBEF;
    --line: #D5DAE1;
    --line-strong: #B9C1CB;
    --text: #14181D;
    --text-dim: #5A6470;
    --accent: #245BC4;
    --accent-soft: #DEE7FA;
    --shadow: 0 1px 2px rgba(20, 24, 29, .06), 0 8px 20px -14px rgba(20, 24, 29, .35);
    --r: 10px;
    --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0F1216;
      --surface: #171B21;
      --surface-2: #1F252D;
      --line: #2A313A;
      --line-strong: #3A434F;
      --text: #E6EAEF;
      --text-dim: #97A1AD;
      --accent: #6EA1FF;
      --accent-soft: #1C2A44;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 24px -16px rgba(0, 0, 0, .9);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0F1216;
    --surface: #171B21;
    --surface-2: #1F252D;
    --line: #2A313A;
    --line-strong: #3A434F;
    --text: #E6EAEF;
    --text-dim: #97A1AD;
    --accent: #6EA1FF;
    --accent-soft: #1C2A44;
    --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 24px -16px rgba(0, 0, 0, .9);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

  /* ---------- Kopf ---------- */
  header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
  .top-inner {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 24px; padding: 24px 0 20px;
  }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -.015em; margin: 0 0 4px; }
  .tagline { color: var(--text-dim); font-size: .95rem; margin: 0; max-width: 52ch; }
  .stat { margin-left: auto; text-align: right; }
  .stat b { font-family: var(--mono); font-size: 1.5rem; font-weight: 500; line-height: 1; display: block; font-variant-numeric: tabular-nums; }
  .stat span { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); }

  /* ---------- Filter ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .toolbar-inner { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 0; }
  .search {
    flex: 1 1 240px; min-width: 190px;
    display: flex; align-items: center; gap: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r);
    padding: 7px 11px;
  }
  .search svg { flex: none; color: var(--text-dim); }
  .search input { border: 0; background: transparent; color: inherit; font: inherit; width: 100%; outline: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip {
    font: inherit; font-size: .85rem;
    border: 1px solid var(--line); background: var(--surface); color: var(--text-dim);
    border-radius: 999px; padding: 4px 12px; cursor: pointer;
    transition: border-color .12s ease, color .12s ease, background .12s ease;
  }
  .chip:hover { border-color: var(--line-strong); color: var(--text); }
  .chip[aria-pressed="true"] {
    background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent);
    color: var(--text); font-weight: 600;
  }
  .chip .n { font-family: var(--mono); font-size: .78em; opacity: .7; margin-left: 5px; }

  /* ---------- Raster ---------- */
  main { padding: 22px 0 56px; }
  .countline { color: var(--text-dim); font-size: .9rem; margin: 0 0 14px; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(216px, 1fr)); }
  .card {
    display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow);
    transition: transform .13s ease, border-color .13s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--line-strong); }
  .shot {
    display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 0;
    background: var(--surface-2) center / cover no-repeat; cursor: zoom-in; overflow: hidden;
  }
  .shot img, .shot svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .meta { padding: 11px 13px 13px; display: flex; flex-direction: column; gap: 5px; }
  .name-row { display: flex; align-items: center; gap: 8px; }
  .swatch { width: 15px; height: 15px; border-radius: 4px; flex: none; border: 1px solid rgba(128, 137, 148, .55); }
  .card h3 { margin: 0; font-size: .98rem; font-weight: 600; line-height: 1.25; }
  .sub { margin: 0; color: var(--text-dim); font-size: .85rem; }
  .empty { border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 40px 20px; text-align: center; color: var(--text-dim); }

  /* ---------- Detail ---------- */
  dialog {
    padding: 0; border: 1px solid var(--line); border-radius: 14px;
    background: var(--surface); color: var(--text);
    max-width: 720px; width: calc(100vw - 32px);
    box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .7);
  }
  dialog::backdrop { background: rgba(9, 12, 16, .62); }
  .d-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  @media (max-width: 620px) { .d-grid { grid-template-columns: 1fr; } }
  .d-shot { background: var(--surface-2) center / cover no-repeat; aspect-ratio: 4 / 3; }
  .d-shot img, .d-shot svg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .d-body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
  .d-body h2 { margin: 0; font-size: 1.35rem; line-height: 1.2; }
  .d-sub { margin: 0; color: var(--text-dim); }
  .d-hint { margin: 0; font-size: .88rem; color: var(--text-dim); }
  .btn {
    font: inherit; font-size: .9rem; cursor: pointer; align-self: flex-start;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--text);
    border-radius: var(--r); padding: 7px 14px;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .d-close {
    position: absolute; top: 10px; right: 12px; z-index: 2;
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; width: 32px; height: 32px; font-size: 17px; line-height: 1; cursor: pointer;
  }

  /* ---------- Fuß ---------- */
  footer.foot {
    border-top: 1px solid var(--line); background: var(--surface);
    padding: 16px 0 28px; color: var(--text-dim); font-size: .87rem;
  }
  .foot-inner { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  .foot a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <div>
      <h1>Filament-Farben auf Lager</h1>
      <p class="tagline">Jede Farbe als gedrucktes Benchy fotografiert. Für eine Anfrage genügt der Farbname unter dem Bild.</p>
    </div>
    <div class="stat"><b id="statIn">–</b><span>Farben vorrätig</span></div>
  </div>
</header>

<div class="toolbar">
  <div class="wrap toolbar-inner">
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path>
      </svg>
      <input id="q" type="search" placeholder="Farbe oder Hersteller suchen …" autocomplete="off">
    </label>
    <div class="chips" id="materials"></div>
  </div>
</div>

<main class="wrap">
  <p class="countline" id="countline"></p>
  <div class="grid" id="grid"></div>
</main>

<footer class="foot">
  <div class="wrap foot-inner">
    <span id="stand"></span>
    <a href="https://rainers3dstube.de">rainers3dstube.de</a>
    <a href="https://rainers3dstube.de/impressum/">Impressum</a>
    <a href="https://rainers3dstube.de/datenschutzerklarung/">Datenschutzerklärung</a>
  </div>
</footer>

<dialog id="detail">
  <button class="d-close" id="dClose" type="button" aria-label="Schließen">×</button>
  <div class="d-grid">
    <div class="d-shot" id="dShot"></div>
    <div class="d-body" id="dBody"></div>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  /* Beispieldaten – greifen nur, wenn keine filaments.csv gefunden wird */
  var DEMO = [
    ["Bambu Lab", "PLA Basic", "Schwarz", "#1B1D21"],
    ["Bambu Lab", "PLA Basic", "Bambu Grün", "#00AE42"],
    ["Bambu Lab", "PLA Silk", "Gold", "#C9A227"],
    ["Polymaker", "PLA", "Muted Blue", "#4A6FA5"],
    ["Extrudr", "PETG", "Anthrazit", "#3B3F42"],
    ["eSun", "ABS+", "Weiß", "#F1F1ED"],
    ["Sunlu", "PLA+", "Grau", "#8A8D91"],
    ["Overture", "TPU 95A", "Natur transparent", "#DCD9CF"],
    ["AzureFilm", "PLA", "Sky Blue", "#3FA9D8"]
  ].map(function (r, i) {
    return { id: "demo" + i, hersteller: r[0], material: r[1], farbe: r[2], hex: r[3], lagernd: "ja", foto: "" };
  });

  /* ---------- CSV ---------- */
  function detectDelimiter(text) {
    var head = text.split(/\r?\n/)[0] || "";
    var counts = { ",": 0, ";": 0, "\t": 0 }, inQ = false;
    for (var i = 0; i < head.length; i++) {
      var c = head[i];
      if (c === '"') inQ = !inQ;
      else if (!inQ && counts.hasOwnProperty(c)) counts[c]++;
    }
    return counts[";"] > counts[","] ? ";" : (counts["\t"] > counts[","] ? "\t" : ",");
  }

  function parseCSV(text) {
    text = text.replace(/^﻿/, "");
    var d = detectDelimiter(text);
    var rows = [], row = [], field = "", inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
        else field += c;
      } else if (c === '"') inQ = true;
      else if (c === d) { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignorieren */ }
      else field += c;
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    rows = rows.filter(function (r) { return r.some(function (v) { return v.trim() !== ""; }); });
    if (!rows.length) return [];
    var head = rows.shift().map(function (h) {
      return h.trim().toLowerCase()
        .replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")
        .replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
    });
    return rows.map(function (r) {
      var o = {};
      head.forEach(function (h, i) { o[h] = (r[i] || "").trim(); });
      return o;
    });
  }

  var TRUE_WORDS = ["ja", "j", "yes", "y", "true", "wahr", "1", "x", "lagernd", "vorhanden"];
  function inStock(row) {
    var v = String(row.lagernd == null ? "" : row.lagernd).trim().toLowerCase();
    if (v === "") {
      var s = parseFloat(String(row.spulen || "").replace(",", "."));
      return isFinite(s) ? s > 0 : false;
    }
    return TRUE_WORDS.indexOf(v) !== -1;
  }

  /* Nur lagernde Zeilen kommen überhaupt in die Galerie. */
  function normalize(rows) {
    var out = [];
    rows.forEach(function (r, i) {
      if (!inStock(r)) return;
      var hex = (r.hex || r.hexcode || r.farbcode || "").trim();
      if (hex && hex[0] !== "#") hex = "#" + hex;
      if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(hex)) hex = "#9AA3AD";
      out.push({
        id: r.id || ("row-" + i),
        hersteller: r.hersteller || r.marke || r.vendor || "",
        material: r.material || r.typ || "",
        farbe: r.farbe || r.name || r.color || ("Filament " + (i + 1)),
        hex: hex,
        foto: r.foto || r.bild || r.image || ""
      });
    });
    return out;
  }

  /* ---------- Ersatzbild, solange kein Foto da ist ---------- */
  function luminance(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }

  function hue(hex) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d < 0.06) return 400 + luminance(hex) * 100;
    var hh = 0;
    if (max === r) hh = ((g - b) / d + 6) % 6;
    else if (max === g) hh = (b - r) / d + 2;
    else hh = (r - g) / d + 4;
    return hh * 60;
  }

  function boatSVG(hex) {
    var dark = luminance(hex) < 0.45;
    var deck = dark ? "rgba(255,255,255,.30)" : "rgba(0,0,0,.22)";
    var line = dark ? "rgba(255,255,255,.55)" : "rgba(0,0,0,.40)";
    return '<svg viewBox="0 0 160 120" role="img" aria-label="Noch kein Foto">' +
      '<rect width="160" height="120" fill="' + hex + '"/>' +
      '<g fill="' + deck + '" stroke="' + line + '" stroke-width="2" stroke-linejoin="round">' +
      '<path d="M34 78h92l-13 20H47z"/><path d="M56 50h44v28H56z"/><rect x="103" y="34" width="11" height="20" rx="3"/></g>' +
      '<g fill="none" stroke="' + line + '" stroke-width="2" stroke-linecap="round">' +
      '<circle cx="70" cy="63" r="6"/><path d="M20 104h30M60 104h34M104 104h36"/></g></svg>';
  }

  /* Sucht das Foto nachsichtig: Endung und Groß-/Kleinschreibung dürfen
     abweichen. Probiert der Reihe nach durch, bis eine Datei antwortet;
     erst wenn keine passt, bleibt der Platzhalter stehen. */
  function candidates(f) {
    var roh = String(f.foto || "").trim();
    if (/^https?:/i.test(roh)) return [roh];

    var list = [];

    /* 1. Was in der Spalte foto steht - exakt, dann mit anderen Endungen. */
    if (roh) {
      var basis = roh.replace(/\.(jpe?g|png|webp|gif|avif)$/i, "");
      if (roh !== basis) list.push(roh);
      [".jpg", ".JPG", ".jpeg", ".png", ".webp"].forEach(function (e) { list.push(basis + e); });
      [".JPG", ".jpg", ".png"].forEach(function (e) { list.push(basis.toUpperCase() + e); });
      [".jpg", ".JPG", ".png"].forEach(function (e) { list.push(basis.toLowerCase() + e); });
    }

    /* 2. Schema MATERIAL_HERSTELLER_FARBE, so wie die Dateien benannt sind.
          Weil der Hersteller dort abgekürzt wird (Bambu Lab -> BAMBU,
          Anycubic -> ANY), werden mehrere Schreibweisen durchprobiert:
          erstes Wort, voller Name und die ersten drei bis fünf Buchstaben. */
    var mat = teilname(f.material);
    var farbe = teilname(f.farbe);
    var voll = teilname(f.hersteller);
    var erstes = teilname(String(f.hersteller || "").split(/\s+/)[0]);

    var hersteller = [erstes, voll, erstes.slice(0, 3), erstes.slice(0, 4), erstes.slice(0, 5)];
    var gesehen = {};
    hersteller.forEach(function (v) {
      if (!mat || !farbe || !v || v.length < 2 || gesehen[v]) return;
      gesehen[v] = 1;
      var name = mat + "_" + v + "_" + farbe;
      [".JPG", ".jpg", ".png"].forEach(function (e) { list.push(name + e); });
      if (v === erstes) {
        [".jpg", ".JPG"].forEach(function (e) { list.push(name.toLowerCase() + e); });
      }
    });

    /* 3. Zum Schluss die id aus Hersteller-Material-Farbe. */
    if (f.id) {
      [".jpg", ".JPG", ".png"].forEach(function (e) { list.push(f.id + e); });
    }

    var seen = {}, raus = [];
    list.forEach(function (n) {
      if (!n || seen[n]) return;
      seen[n] = 1;
      raus.push("images/" + n);
    });
    return raus;
  }

  /* Ein Namensteil im Schema: GROSS, Leerzeichen zu Bindestrich, + und
     Sonderzeichen raus. "PLA Silk" -> PLA-SILK, "PLA+" -> PLA, "Sky Blue" -> SKY-BLUE */
  function teilname(s) {
    return String(s || "")
      .toUpperCase()
      .replace(/Ä/g, "AE").replace(/Ö/g, "OE").replace(/Ü/g, "UE").replace(/ß/g, "SS")
      .replace(/\+/g, "")
      .replace(/[^A-Z0-9]+/g, "-")
      .replace(/^-|-$/g, "");
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* Bild einhängen: der Platzhalter liegt als Hintergrund darunter, das Foto darüber.
     Klappt eine Quelle nicht, wird die nächste probiert; klappt keine, bleibt der Platzhalter. */
  function mountShot(host, f, eager) {
    var srcs = candidates(f), i = 0;
    host.innerHTML = "";
    host.style.backgroundImage = 'url("data:image/svg+xml;utf8,' + encodeURIComponent(boatSVG(f.hex)) + '")';
    function tryNext() {
      if (i >= srcs.length) return;
      var img = document.createElement("img");
      img.alt = "Benchy in " + f.farbe;
      img.decoding = "async";
      if (!eager) img.loading = "lazy";
      img.onerror = function () {
        if (img.parentNode) img.parentNode.removeChild(img);
        i++; tryNext();
      };
      host.appendChild(img);
      img.src = srcs[i];
    }
    tryNext();
  }

  /* ---------- Zustand ---------- */
  var DATA = [], state = { q: "", material: "" };
  var $ = function (id) { return document.getElementById(id); };
  var grid = $("grid"), dlg = $("detail");

  function visible() {
    var q = state.q.toLowerCase();
    return DATA.filter(function (f) {
      if (state.material && f.material !== state.material) return false;
      if (q && (f.farbe + " " + f.hersteller + " " + f.material).toLowerCase().indexOf(q) === -1) return false;
      return true;
    }).sort(function (a, b) { return hue(a.hex) - hue(b.hex); });
  }

  function render() {
    var list = visible();
    $("countline").textContent = (state.q || state.material)
      ? list.length + " von " + DATA.length + " Farben"
      : list.length + " Farben, sortiert nach Farbton";
    if (!list.length) {
      grid.innerHTML = '<p class="empty">Zu dieser Suche ist gerade nichts auf Lager.</p>';
      return;
    }
    grid.innerHTML = list.map(function (f, i) {
      return '<article class="card">' +
        '<button class="shot" type="button" data-i="' + i + '" aria-label="' + esc(f.farbe) + ' größer ansehen"></button>' +
        '<div class="meta">' +
        '<div class="name-row"><span class="swatch" style="background:' + esc(f.hex) + '"></span><h3>' + esc(f.farbe) + '</h3></div>' +
        '<p class="sub">' + esc(f.hersteller) + (f.hersteller && f.material ? " · " : "") + esc(f.material) + '</p>' +
        '</div></article>';
    }).join("");
    Array.prototype.forEach.call(grid.querySelectorAll(".shot"), function (b) {
      var f = list[+b.dataset.i];
      mountShot(b, f, false);
      b.addEventListener("click", function () { openDetail(f); });
    });
  }

  function label(f) {
    return [f.farbe, f.material, f.hersteller].filter(Boolean).join(" · ");
  }

  function openDetail(f) {
    mountShot($("dShot"), f, true);
    $("dBody").innerHTML =
      '<div class="name-row"><span class="swatch" style="background:' + esc(f.hex) + '"></span>' +
      '<h2>' + esc(f.farbe) + '</h2></div>' +
      '<p class="d-sub">' + esc(f.hersteller) + (f.hersteller && f.material ? " · " : "") + esc(f.material) + '</p>' +
      '<button class="btn" type="button" id="copyBtn">Bezeichnung kopieren</button>' +
      '<p class="d-hint">Diese Bezeichnung genügt für deine Anfrage.</p>';
    var btn = $("copyBtn");
    btn.addEventListener("click", function () {
      var text = label(f);
      var done = function () { btn.textContent = "Kopiert ✓"; setTimeout(function () { btn.textContent = "Bezeichnung kopieren"; }, 1800); };
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, function () { btn.textContent = text; });
        else btn.textContent = text;
      } catch (e) { btn.textContent = text; }
    });
    if (typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
  }

  function buildFilters() {
    var mat = {};
    DATA.forEach(function (f) { if (f.material) mat[f.material] = (mat[f.material] || 0) + 1; });
    var keys = Object.keys(mat);
    $("materials").innerHTML = keys.length < 2 ? "" :
      '<button class="chip" type="button" data-m="" aria-pressed="true">Alle</button>' +
      keys.sort(function (a, b) { return mat[b] - mat[a] || a.localeCompare(b, "de"); }).map(function (m) {
        return '<button class="chip" type="button" data-m="' + esc(m) + '" aria-pressed="false">' + esc(m) +
          '<span class="n">' + mat[m] + "</span></button>";
      }).join("");
    Array.prototype.forEach.call($("materials").children, function (c) {
      c.addEventListener("click", function () {
        state.material = c.dataset.m;
        Array.prototype.forEach.call($("materials").children, function (o) { o.setAttribute("aria-pressed", String(o === c)); });
        render();
      });
    });
    $("statIn").textContent = DATA.length;
  }

  function setStand(dateStr) {
    if (!dateStr) { $("stand").textContent = ""; return; }
    var d = new Date(dateStr);
    if (isNaN(d)) { $("stand").textContent = ""; return; }
    $("stand").textContent = "Bestand zuletzt aktualisiert am " +
      d.toLocaleDateString("de-DE", { day: "2-digit", month: "long", year: "numeric" });
  }

  function load(rows) { DATA = normalize(rows); buildFilters(); render(); }

  $("q").addEventListener("input", function (e) { state.q = e.target.value; render(); });
  $("dClose").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  fetch("filaments.csv", { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      setStand(r.headers.get("last-modified"));
      return r.text();
    })
    .then(function (t) {
      var rows = parseCSV(t);
      if (!rows.length) throw new Error("leer");
      load(rows);
    })
    .catch(function () { load(DEMO); });
})();
</script>

</body>
</html>
